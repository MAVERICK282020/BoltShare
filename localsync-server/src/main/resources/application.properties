server.port=8080
# SSL disabled for local development (no certificate warnings)
# To enable HTTPS: uncomment below and run keytool to generate cert
# server.ssl.enabled=true
# server.ssl.key-store=classpath:certs/localsync.p12
# server.ssl.key-store-password=localsync123
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=localsync

# SQLite Database with WAL and concurrency busy_timeout
spring.datasource.url=jdbc:sqlite:localsync.db?busy_timeout=15000&journal_mode=WAL&synchronous=NORMAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# Logging
logging.level.com.localsync=DEBUG
logging.level.org.springframework.security=WARN

# LocalSync custom config
localsync.jwt.secret=LocalSync_Super_Secret_Key_2024_Minimum_256_Bits_Required_For_HS256
localsync.jwt.expiration=86400000
localsync.qr.expiry-seconds=900
localsync.transfer.chunk-dir=./transfer-chunks
localsync.allowed-roots=C:/,D:/
